name: Estilo de Código (Pint)

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: read

jobs:
  pint:
    name: pint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          coverage: none

      - name: Cache do Composer
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}

      - name: Instalar dependências
        run: composer install --no-interaction --prefer-dist --no-progress --ignore-platform-reqs

      - name: Rodar Pint
        if: steps.composer_install.outcome == 'success'
        run: |
          if ./vendor/bin/pint --test; then
            corpo="<!-- pint-bot -->
          ## ✅ Pint — nenhum problema de estilo"
          else
            pint_ok=1
            corpo="<!-- pint-bot -->
          ## ❌ Pint encontrou problemas de estilo

          Rode \`./vendor/bin/pint\` localmente (sem \`--test\`) para corrigir automaticamente, depois faça commit e push."
          fi
          echo "$corpo" >> "$GITHUB_STEP_SUMMARY"
          echo "$corpo" > /tmp/comentario.md
          echo "${{ github.event.pull_request.number }}" > /tmp/pr_number.txt
          [ -z "$pint_ok" ]

      - name: Publicar artefato do comentário
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-comment-pint
          path: |
            /tmp/comentario.md
            /tmp/pr_number.txt
          retention-days: 1
          if-no-files-found: ignore
